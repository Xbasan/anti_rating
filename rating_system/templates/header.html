{% load static %}  <!-- ← ДОБАВЬ ЭТУ СТРОКУ -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Антирейтинг</title>
  <link rel="stylesheet" href="{% static 'css/main_style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="background"></div>

  <div class="content">
    <header class="header">
        <div class="container header__container">
            <!-- ЛЕВАЯ ЧАСТЬ: Навигация (только для авторизованных) -->
            {% if user.is_authenticated %}
            <nav>
                <ul class="nav">
                    <li><a href="{% url 'main' %}" class="nav__link {% if request.resolver_match.url_name == 'main' %}nav__link--active{% endif %}"><i class="fas fa-home"></i> Главная</a></li>
                    <li><a href="{% url 'news' %}" class="nav__link {% if request.resolver_match.url_name == 'news' %}nav__link--active{% endif %}"><i class="fas fa-newspaper"></i> Новости</a></li>
                    <li><a href="{% url 'complaint' %}" class="nav__link {% if request.resolver_match.url_name == 'complaint' %}nav__link--active{% endif %}"><i class="fas fa-exclamation-circle"></i> Пожаловаться</a></li>
                </ul>
            </nav>
            {% endif %}

            <!-- ПРАВАЯ ЧАСТЬ: ФИО + Выйти (только для авторизованных) -->
            <div style="margin-left: auto; display: flex; align-items: center; gap: 20px;">
                <!-- ФИО преподавателя -->
                <span style="color: #fff; font-weight: 500;">
                    <i class="fas fa-user"></i> {{ user.teacher_profile.full_name }}
                </span>

                <!-- Кнопка Выйти -->
                <a href="{% url 'login' %}" class="nav__link nav__link--button">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </a>
            </div>
        </div>
    </header>
    <main class="container main" >
        {% block content %}
        {% endblock %}      
    </main>
  </div>
  
</body>
</html>
